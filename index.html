<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>SENTINEL V20 SMC ULTRA PRO MAX</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--g:#14f195;--r:#ff4b4b;--gold:#ffd700;--blue:#06b6d4;--purple:#8b5cf6;--orange:#f97316;--smc:#00f2ff;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;overscroll-behavior:none;background:#000;color:#fff;font-family:'Inter',sans-serif;overflow-x:hidden;}
.hdr{font-family:'Orbitron',sans-serif;background:linear-gradient(180deg,rgba(20,241,149,0.1) 0%,transparent 100%);border-bottom:1px solid rgba(255,255,255,0.1);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);}
.orbitron{font-family:'Orbitron',sans-serif;}
.card{background:rgba(20,20,25,0.8);border:1px solid rgba(255,255,255,0.05);border-radius:12px;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);}
.card:hover{border-color:var(--g);box-shadow:0 0 20px rgba(20,241,149,0.15);transform:translateY(-2px);}
.btn-smc{background:linear-gradient(90deg, #06b6d4, #8b5cf6); border-radius:8px; font-weight:700; text-transform:uppercase;}
.glow-g{text-shadow:0 0 10px var(--g);}
.glow-smc{text-shadow:0 0 10px var(--smc); color:var(--smc);}
.bg-smc{background:rgba(0,242,255,0.1); border:1px solid var(--smc);}
@keyframes pulse-smc{0%{box-shadow:0 0 0 0 rgba(0,242,255,0.4);} 70%{box-shadow:0 0 0 10px rgba(0,242,255,0);} 100%{box-shadow:0 0 0 0 rgba(0,242,255,0);}}
.pulse-smc{animation:pulse-smc 2s infinite;}
/* Custom Scrollbar */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:#000;}
::-webkit-scrollbar-thumb{background:var(--g);border-radius:10px;}
</style>
</head>
<body class="pb-20">

<header class="hdr px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-zinc-900 border border-emerald-500/50 rounded-xl flex items-center justify-center pulse-smc">
            <span class="text-emerald-500 font-black text-xl">S</span>
        </div>
        <div>
            <h1 class="text-lg font-black tracking-tighter orbitron leading-none">SENTINEL <span class="text-emerald-400 italic">V20</span></h1>
            <p class="text-[10px] text-zinc-500 font-bold tracking-[0.2em] uppercase">SMC Ultra Pro Max Engine</p>
        </div>
    </div>
    <div class="flex items-center gap-3">
        <div id="connectionStatus" class="flex items-center gap-1.5 bg-zinc-900 px-2.5 py-1 rounded-full border border-emerald-500/20">
            <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
            <span class="text-[10px] font-bold text-emerald-500 uppercase">Live</span>
        </div>
        <button onclick="toggleSettings()" class="w-9 h-9 bg-zinc-900 border border-zinc-800 rounded-full flex items-center justify-center">
            <svg class="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        </button>
    </div>
</header>

<main class="p-4 space-y-4">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div class="card p-3">
            <p class="text-[10px] text-zinc-500 font-bold uppercase mb-1">Portfolio Value</p>
            <h3 id="stat-value" class="text-xl font-black orbitron">$0.00</h3>
        </div>
        <div class="card p-3">
            <p class="text-[10px] text-zinc-500 font-bold uppercase mb-1">Win Rate</p>
            <h3 id="stat-winrate" class="text-xl font-black orbitron text-emerald-400">0%</h3>
        </div>
        <div class="card p-3 border-emerald-500/30">
            <p class="text-[10px] text-zinc-400 font-bold uppercase mb-1">Supreme Signals</p>
            <h3 id="stat-supreme" class="text-xl font-black orbitron glow-g">0</h3>
        </div>
        <div class="card p-3 border-cyan-500/30">
            <p class="text-[10px] text-zinc-400 font-bold uppercase mb-1">SMC Liquidity</p>
            <h3 id="stat-smc" class="text-xl font-black orbitron glow-smc">0</h3>
        </div>
    </div>

    <section class="space-y-3">
        <div class="flex items-center justify-between px-1">
            <h2 class="text-xs font-black uppercase tracking-widest text-zinc-400">SMC Real-Time Scanner</h2>
            <div id="timer" class="text-[10px] font-mono text-emerald-500 bg-emerald-500/10 px-2 py-0.5 rounded">REFRESHING IN 30s</div>
        </div>
        
        <div id="tokenContainer" class="space-y-3">
            <div class="p-10 text-center text-zinc-600 font-bold animate-pulse uppercase tracking-widest text-xs">
                Scanning Liquidity Pools...
            </div>
        </div>
    </section>
</main>

<nav class="fixed bottom-0 left-0 right-0 bg-black/90 backdrop-blur-xl border-t border-zinc-800 px-6 py-3 flex justify-between items-center z-50">
    <button class="flex flex-col items-center gap-1 text-emerald-500">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
        <span class="text-[10px] font-bold uppercase">Scanner</span>
    </button>
    <button onclick="openPortfolio()" class="flex flex-col items-center gap-1 text-zinc-500">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span class="text-[10px] font-bold uppercase">Portfolio</span>
    </button>
    <button onclick="triggerManualRefresh()" class="w-12 h-12 bg-emerald-500 text-black rounded-full flex items-center justify-center -mt-8 border-4 border-black shadow-lg shadow-emerald-500/20">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
    </button>
    <button class="flex flex-col items-center gap-1 text-zinc-500">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        <span class="text-[10px] font-bold uppercase">Analysis</span>
    </button>
    <button onclick="toggleSettings()" class="flex flex-col items-center gap-1 text-zinc-500">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m12 4a2 2 0 100-4m0 4a2 2 0 110-4m-6 0a2 2 0 100-4m0 4a2 2 0 110-4m-6 0V4m0 2V4m6 16v-2m0 2v-2m6 16v-2m0 2v-2"/></svg>
        <span class="text-[10px] font-bold uppercase">Config</span>
    </button>
</nav>

<script>
// ── 1. CONFIGURASI V20 SMC ──
const CFG = {
    REFRESH_RATE: 20000,
    MIN_LIQUIDITY: 15000,
    SMC_VOL_MULT: 3.5,
    LIQ_SWEEP_DROP: -8.5,
    BUY_RATIO_SMC: 0.72,
    BACKEND_SNIPE_URL: "http://localhost:3000/api/snipe", // Endpoint untuk Bot Eksekusi
    TG_TOKEN: "", // Isi Token Telegram anda
    TG_CHAT_ID: ""
};

let portfolio = JSON.parse(localStorage.getItem('sv20_port') || '{}');
let scannerActive = true;
let timeLeft = 20;

// ── 2. SMC & LIQUIDITY ENGINE ──
function detectSMC(p, m5, buyRatio) {
    let smcSignal = 'NONE';
    let smcScore = 0;

    const volM5 = p.volume?.m5 || 0;
    const volH1avg = (p.volume?.h1 || 0) / 12;
    const liq = p.liquidity?.usd || 0;
    
    // Deteksi Imbalance / Fair Value Gap (FVG)
    const isHighVolume = volM5 > (volH1avg * CFG.SMC_VOL_MULT) && volM5 > 10000;

    // Bullish Order Block (Demand Zone)
    if (isHighVolume && buyRatio > 0.75 && m5 > 1.5) {
        smcSignal = 'BULLISH_OB'; 
        smcScore += 25;
    } 
    // Liquidity Sweep (Smart Money Serok saat Panic Sell)
    else if (m5 < CFG.LIQ_SWEEP_DROP && buyRatio > CFG.BUY_RATIO_SMC && liq > 20000) {
        smcSignal = 'LIQ_SWEEP_BUY';
        smcScore += 35; 
    }

    return { smcSignal, smcScore };
}

function calcEQSV20(p, smc, br, m5) {
    let s = 1;
    // Core Momentum
    s += br >= 0.70 ? 2 : br >= 0.60 ? 1 : 0;
    s += m5 >= 10 ? 2 : m5 >= 5 ? 1 : 0;
    
    // SMC Multiplier
    if (smc.smcSignal === 'LIQ_SWEEP_BUY') s += 4;
    if (smc.smcSignal === 'BULLISH_OB') s += 2;
    
    // Safety
    if (p.baseToken.symbol.includes("RUG") || p.baseToken.name.includes("TEST")) s -= 5;
    
    return Math.max(1, Math.min(10, s));
}

// ── 3. DYNAMIC TRAILING STOP & PORTFOLIO ──
function updateTrailing(addr, currentPrice) {
    let item = portfolio[addr];
    if (!item || item.closed) return;

    if (!item.entry) item.entry = currentPrice;
    if (!item.trailingSL) item.trailingSL = item.entry * 0.85; // Initial SL -15%

    const pnl = ((currentPrice - item.entry) / item.entry) * 100;

    // Trailing Logic
    if (pnl >= 50 && item.trailingSL < item.entry) {
        item.trailingSL = item.entry; // Move to Breakeven
        notifyTelegram(`🚀 [TRAILING] ${item.sym} SL moved to Breakeven (+50% hit)`);
    } else if (pnl >= 120 && item.trailingSL < (item.entry * 1.5)) {
        item.trailingSL = item.entry * 1.5; // Lock 50% Profit
        notifyTelegram(`🎯 [TRAILING] ${item.sym} SL locked at +50% (+120% hit)`);
    }

    // Stop Out Check
    if (currentPrice <= item.trailingSL) {
        item.closed = true;
        item.exitPrice = currentPrice;
        item.finalPnl = pnl;
        notifyTelegram(`🛑 [EXIT] ${item.sym} Hit Trailing Stop at ${pnl.toFixed(2)}%`);
        savePortfolio();
    }
}

// ── 4. MAIN SCANNER CORE ──
async function fetchTokens() {
    try {
        const res = await fetch('https://api.dexscreener.com/latest/dex/tokens/solana');
        const data = await res.json();
        if(!data.pairs) return;

        const container = document.getElementById('tokenContainer');
        container.innerHTML = '';
        
        let supremeCount = 0;
        let smcCount = 0;

        const processed = data.pairs
            .filter(p => p.liquidity?.usd > CFG.MIN_LIQUIDITY)
            .map(p => {
                const br = (p.txns?.m5?.buys / (p.txns?.m5?.buys + p.txns?.m5?.sells)) || 0.5;
                const m5 = p.priceChange?.m5 || 0;
                const smc = detectSMC(p, m5, br);
                const eqs = calcEQSV20(p, smc, br, m5);
                
                let signal = 'NONE';
                if (eqs >= 8) { signal = 'SUPREME'; supremeCount++; }
                else if (eqs >= 6) signal = 'PRIME';

                if (smc.smcSignal !== 'NONE') smcCount++;

                return { ...p, br, m5, smc, eqs, signal };
            })
            .sort((a,b) => b.eqs - a.eqs);

        processed.slice(0, 15).forEach(token => {
            renderTokenRow(token, container);
            if (token.signal === 'SUPREME') triggerAutoSnipe(token);
        });

        document.getElementById('stat-supreme').textContent = supremeCount;
        document.getElementById('stat-smc').textContent = smcCount;

    } catch (e) {
        console.error("Scanner Error:", e);
    }
}

function renderTokenRow(t, container) {
    const isSMC = t.smc.smcSignal !== 'NONE';
    const row = document.createElement('div');
    row.className = `card p-4 relative overflow-hidden ${t.signal === 'SUPREME' ? 'border-emerald-500/50 bg-emerald-500/5' : ''} ${isSMC ? 'bg-smc' : ''}`;
    
    row.innerHTML = `
        <div class="flex justify-between items-start mb-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center font-black text-xs border border-zinc-700">
                    ${t.baseToken.symbol.substring(0,3)}
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h4 class="font-black orbitron text-sm">${t.baseToken.symbol}</h4>
                        ${t.signal === 'SUPREME' ? '<span class="bg-emerald-500 text-black text-[8px] font-black px-1.5 py-0.5 rounded uppercase">Supreme</span>' : ''}
                        ${isSMC ? `<span class="bg-cyan-500 text-black text-[8px] font-black px-1.5 py-0.5 rounded uppercase">${t.smc.smcSignal}</span>` : ''}
                    </div>
                    <p class="text-[10px] text-zinc-500 font-mono">${t.baseToken.address.substring(0,6)}...${t.baseToken.address.slice(-4)}</p>
                </div>
            </div>
            <div class="text-right">
                <p class="text-[10px] text-zinc-500 font-bold uppercase">Price</p>
                <p class="text-sm font-black orbitron">$${parseFloat(t.priceUsd).toFixed(8)}</p>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-2 mb-4">
            <div class="bg-black/40 rounded-lg p-2 border border-zinc-800">
                <p class="text-[8px] text-zinc-500 font-bold uppercase">EQS Score</p>
                <p class="text-xs font-black ${t.eqs > 7 ? 'text-emerald-400' : 'text-zinc-300'}">${t.eqs}/10</p>
            </div>
            <div class="bg-black/40 rounded-lg p-2 border border-zinc-800">
                <p class="text-[8px] text-zinc-500 font-bold uppercase">5M Change</p>
                <p class="text-xs font-black ${t.m5 >= 0 ? 'text-emerald-400' : 'text-red-400'}">${t.m5 > 0 ? '+' : ''}${t.m5}%</p>
            </div>
            <div class="bg-black/40 rounded-lg p-2 border border-zinc-800">
                <p class="text-[8px] text-zinc-500 font-bold uppercase">Buy Ratio</p>
                <p class="text-xs font-black text-zinc-300">${(t.br * 100).toFixed(0)}%</p>
            </div>
        </div>

        <div class="flex gap-2">
            <a href="https://dexscreener.com/solana/${t.baseToken.address}" target="_blank" class="flex-1 bg-zinc-800 hover:bg-zinc-700 py-2 rounded-lg text-center text-[10px] font-black uppercase tracking-wider transition-colors">Chart</a>
            <a href="https://jup.ag/swap/SOL-${t.baseToken.address}" target="_blank" class="flex-1 bg-emerald-500 hover:bg-emerald-400 text-black py-2 rounded-lg text-center text-[10px] font-black uppercase tracking-wider transition-transform active:scale-95">Swap Now</a>
        </div>
    `;
    container.appendChild(row);
}

// ── 5. AUTOMATION & NOTIF ──
async function triggerAutoSnipe(token) {
    if (!CFG.BACKEND_SNIPE_URL) return;
    
    try {
        await fetch(CFG.BACKEND_SNIPE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                ca: token.baseToken.address,
                sym: token.baseToken.symbol,
                smc: token.smc.smcSignal,
                eqs: token.eqs,
                timestamp: Date.now()
            })
        });
    } catch (e) { /* Silent fail if backend not active */ }
}

function notifyTelegram(msg) {
    if (!CFG.TG_TOKEN || !CFG.TG_CHAT_ID) return;
    const url = `https://api.telegram.org/bot${CFG.TG_TOKEN}/sendMessage?chat_id=${CFG.TG_CHAT_ID}&text=${encodeURIComponent(msg)}&parse_mode=HTML`;
    fetch(url);
}

function savePortfolio() {
    localStorage.setItem('sv20_port', JSON.stringify(portfolio));
}

// ── 6. TIMER & REFRESH ──
function startTimer() {
    setInterval(() => {
        if (timeLeft <= 0) {
            timeLeft = 20;
            fetchTokens();
        } else {
            timeLeft--;
        }
        document.getElementById('timer').textContent = `REFRESHING IN ${timeLeft}s`;
    }, 1000);
}

function triggerManualRefresh() {
    timeLeft = 20;
    fetchTokens();
}

// ── INIT ──
window.onload = () => {
    fetchTokens();
    startTimer();
};
</script>
</body>
</html>
